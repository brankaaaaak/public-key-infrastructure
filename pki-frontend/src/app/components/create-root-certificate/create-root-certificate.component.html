<div class="create-root-container">
  <h2>Create Root Certificate</h2>
  <p>This action will create a new Root Certificate.</p>

  <button class="btn btn-primary" (click)="createRootCertificate()">
    Create Root Certificate
  </button>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
</div>
