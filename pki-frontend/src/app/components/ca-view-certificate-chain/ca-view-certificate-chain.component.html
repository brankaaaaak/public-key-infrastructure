<div *ngIf="tree">
  <h2>My Certificate Chain</h2>
  <ul>
    <ng-container *ngTemplateOutlet="renderNode; context:{ $implicit: tree }"></ng-container>
  </ul>
</div>

<ng-template #renderNode let-node>
  <li>
    <strong>{{node.type}}</strong> ({{node.serialNumber}}) - {{node.ownerEmail}}
    <span *ngIf="node.revoked" style="color:red;">[REVOKED]</span>
    <ul *ngIf="node.children && node.children.length > 0">
      <ng-container *ngFor="let child of node.children">
        <ng-container *ngTemplateOutlet="renderNode; context:{ $implicit: child }"></ng-container>
      </ng-container>
    </ul>
  </li>
</ng-template>
