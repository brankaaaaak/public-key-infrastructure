<h2 mat-dialog-title>Revoke Certificate</h2>
<mat-dialog-content>
  <mat-form-field appearance="fill" style="width: 100%;">
    <mat-label>Reason</mat-label>
    <mat-select [(value)]="selectedReason">
      <mat-option *ngFor="let reason of reasons" [value]="reason">
        {{ reason }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="warn" [disabled]="!selectedReason" (click)="confirm()">Revoke</button>
</mat-dialog-actions>
