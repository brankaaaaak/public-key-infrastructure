<div class="create-root-container">
  <h2>Create Root Certificate</h2>
  <p>This action will create a new Root Certificate.</p>
  <div>
    <label for="issuer">Issuer Certificate</label>
    <select id="issuer" formControlName="issuerSerialNumber">
      <option *ngFor="let cert of caCertificates" [value]="cert.serialNumber">
        {{ cert.serialNumber }} - {{ cert.owner.email }} - {{cert.validFrom}}- {{cert.validTo}}
      </option>
    </select>
  </div>
  <div class="form-group">
    <label for="duration">Duration (in days):</label>
    <input
      id="duration"
      type="number"
      class="form-control"
      [(ngModel)]="durationInDays"
      placeholder="Enter number of days"
      min="1"
      required
    />
  </div>
  
  <button class="btn btn-primary" (click)="createRootCertificate()">
    Create Root Certificate
  </button>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
</div>
