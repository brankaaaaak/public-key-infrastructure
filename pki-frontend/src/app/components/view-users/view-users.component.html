<div *ngIf="loading">Loading users...</div>
<div *ngIf="error" class="error">{{ error }}</div>

<table *ngIf="!loading && !error" class="user-table">
  <thead>
  <tr>
    <th>No.</th>
    <th>First Name</th>
    <th>Last Name</th>
    <th>Email</th>
    <th>Organization</th>
    <th>Status</th>
    <th>Role</th>
    <th>Action</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let user of users; index as i">
    <td>{{ i + 1 }}</td>
    <td>{{ user.name }}</td>
    <td>{{ user.lastName }}</td>
    <td>{{ user.email }}</td>
    <td>{{ user.organization }}</td>
    <td>{{ user.enabled ? 'Active' : 'Deactive' }}</td>
    <td>{{ user.role === 'ROLE_USER' ? 'User' : 'CA' }}</td>
    <td>
      <button
        *ngIf="user.role === 'ROLE_USER'"
        class="btn-upgrade"
        (click)="upgrade(user.id)">
        Upgrade to CA
      </button>
    </td>
  </tr>
  </tbody>
</table>
